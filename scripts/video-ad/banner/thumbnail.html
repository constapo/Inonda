<!doctype html><html><head><meta charset="utf-8">
<!-- Inonda video thumbnail, 1280x720. bg.png = frame 3s of Adobe Stock clip 617062551, flipped; logo.png = docs/video-ad/logo.png. -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@800;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:Figtree,Inter,sans-serif;background:#0b1f3a}
.bg{position:absolute;inset:0;background:url(bg.png) 70% center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,24,52,.97) 0%,rgba(8,24,52,.92) 38%,rgba(8,24,52,.55) 58%,rgba(8,24,52,0) 75%)}
.logo{position:absolute;left:48px;top:44px;display:flex;align-items:center;gap:16px}
.logo .b{width:104px;height:104px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center}
.logo img{width:88px}
.logo span{color:#fff;font-weight:800;font-size:34px;letter-spacing:.5px}
.h{position:absolute;left:48px;top:196px;color:#fff;font-weight:900;line-height:.98;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.h .a{font-size:92px}
.h .c{font-size:92px;color:#7cc4ff}
.chips{position:absolute;left:48px;top:520px;display:flex;gap:14px}
.chip{font-weight:900;font-size:40px;padding:10px 24px;border-radius:14px;background:#facc15;color:#0b1f3a}
.chip.o{background:#2563eb;color:#fff}
.gr{position:absolute;left:48px;top:618px;color:#e2ecff;font-family:Inter,sans-serif;font-weight:600;font-size:30px}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="logo"><div class="b"><img src="logo.png"></div><span>INONDA LTD</span></div>
<div class="h"><div class="a">Repairs &amp;</div><div class="a">Maintenance</div><div class="c">in Cyprus</div></div>
<div class="chips"><span class="chip">24/7</span><span class="chip o">Free assessment</span></div>
<div class="gr">Συντήρηση &amp; επισκευές ακινήτων</div>
</body></html>
